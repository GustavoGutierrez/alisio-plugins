<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="free-models-cover-title free-models-cover-desc">
  <title id="free-models-cover-title">Free Models</title>
  <desc id="free-models-cover-desc">An open gift box releasing sparks, next to the plugin name, representing free model access with no setup.</desc>
  <defs>
    <linearGradient id="free-models-cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041f1b"/>
      <stop offset="0.55" stop-color="#0a4a3e"/>
      <stop offset="1" stop-color="#11735e"/>
    </linearGradient>
    <radialGradient id="free-models-cover-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ff0c9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7ff0c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="free-models-cover-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d3a0"/>
      <stop offset="1" stop-color="#18a77c"/>
    </linearGradient>
    <clipPath id="free-models-cover-frame"><rect width="1600" height="900" rx="44"/></clipPath>
  </defs>
  <g clip-path="url(#free-models-cover-frame)">

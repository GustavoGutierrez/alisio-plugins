    <circle cx="1210" cy="380" r="340" fill="url(#free-models-cover-glow)"/>
    <g fill="none" stroke="#7ff0c9" stroke-opacity="0.14" stroke-width="3">
      <path d="M-60 760 C 320 640 640 880 1000 760 S 1600 640 1720 720"/>

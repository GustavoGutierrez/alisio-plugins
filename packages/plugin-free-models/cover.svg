    <path d="M1080 200l12 32 32 12-32 12-12 32-12-32-32-12 32-12z" fill="#ffe6a3"/>
    <path d="M1350 230l10 26 26 10-26 10-10 26-10-26-26-10 26-10z" fill="#ffe6a3"/>
    <path d="M1010 420l390-90 16 70-390 90z" fill="#7ff0c9"/>
    <rect x="1040" y="500" width="340" height="220" rx="24" fill="url(#free-models-cover-box)"/>
    <rect x="1182" y="500" width="56" height="220" fill="#ffd166"/>

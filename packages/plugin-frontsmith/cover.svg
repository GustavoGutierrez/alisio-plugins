<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Frontsmith plugin cover">
  <title>Frontsmith</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#f9fafb" text-anchor="middle">
    <text x="800" y="250" font-size="96" font-weight="700">Frontsmith</text>
    <text x="800" y="320" font-size="34" fill="#d1d5db">Gated frontend engineering for Alisio</text>
  </g>
  <g fill="none" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow)">
    <path d="M330 520 H430"/>
    <path d="M630 520 H730"/>
    <path d="M930 520 H1030"/>
    <path d="M1230 520 H1330"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#f9fafb" text-anchor="middle">
    <rect x="130" y="460" width="200" height="120" rx="18" fill="#0b1220" stroke="#f59e0b" stroke-width="3"/>
    <text x="230" y="531">specify</text>
    <rect x="430" y="460" width="200" height="120" rx="18" fill="#0b1220" stroke="#f59e0b" stroke-width="3"/>
    <text x="530" y="531">build</text>
    <rect x="730" y="460" width="200" height="120" rx="18" fill="#0b1220" stroke="#f59e0b" stroke-width="3"/>
    <text x="830" y="531">validate</text>
    <rect x="1030" y="460" width="200" height="120" rx="18" fill="#0b1220" stroke="#f59e0b" stroke-width="3"/>
    <text x="1130" y="531">review</text>
    <rect x="1330" y="460" width="140" height="120" rx="18" fill="#0b1220" stroke="#22c55e" stroke-width="3"/>
    <text x="1400" y="531">PASS</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" fill="#9ca3af" text-anchor="middle">
    <text x="800" y="720">Tools decide, agents judge. Missing evidence is never a pass.</text>
  </g>
</svg>

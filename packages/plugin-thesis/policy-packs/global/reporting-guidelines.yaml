# Reporting guidelines (EQUATOR Network library). A matching rule becomes a checklist the
# methodologist and reviewer use; it is not a format rule. `studyDesign` is a proposed brief
# field (see P0.6-results.md open questions); `approach` values follow spec §4.2.
rules:
- ruleId: GLOBAL.RG.PRISMA.2020
  level: METHODOLOGY_GUIDELINE
  authority:
    organization: PRISMA Group
  document:
    id: PRISMA
    version: '2020'
  status: active
  appliesWhen:
    approach: systematic_review
  requirement:
    kind: reporting_guideline
    values:
      guideline: PRISMA 2020
      items: 27
      extras:
      - abstract checklist
      - flow diagram
      doi: 10.1136/bmj.n71
      scope: Systematic reviews with or without meta-analysis
  source:
    reference: Page MJ et al. The PRISMA 2020 statement. BMJ 2021;372:n71
    url: https://www.equator-network.org/reporting-guidelines/prisma/
    retrievedAt: '2026-10-04'
  verification:
    lastChecked: '2026-10-04'
    basis: official_text
  supersedes:
  - PRISMA 2009
- ruleId: GLOBAL.RG.PRISMA_S.2021
  level: METHODOLOGY_GUIDELINE
  authority:
    organization: PRISMA Group
  document:
    id: PRISMA-S
    version: '2021'
  status: active
  appliesWhen:
    approach: systematic_review
  requirement:
    kind: reporting_guideline
    values:
      guideline: PRISMA-S
      items: 16

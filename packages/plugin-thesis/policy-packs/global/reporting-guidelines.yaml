  source:
    reference: Rethlefsen ML et al. PRISMA-S. Syst Rev 2021;10:39
    url: https://www.prisma-statement.org/prisma-search
    retrievedAt: '2026-10-04'
  verification:
    lastChecked: '2026-10-04'
    basis: official_text
  supersedes: []

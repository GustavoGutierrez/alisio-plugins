  # standard or citation style; Ley 30 de 1992 arts. 28–29 leave it to the institution.
  presentationStandard: null
  citationStyle: null
  askInRound2: [citationStyle, presentationStandard, institution]
availableStandards: [icontec-ntc1486-2022]
ethicsTriggers:          # questionnaire ids answered yes/no (spec §11.4); `minors` is proposed here
  - human_participants
  - identifiable_personal_data
  - sensitive_data
  - intervention
  - risk_above_minimal
  - biological_samples
  - animals
  - communities
  - clinical_research
  - minors
  - additional_institutional_rules
domains:
  health: domains/health/
watchList:
  - id: minsalud-draft-replacing-res-8430-titles-I-II

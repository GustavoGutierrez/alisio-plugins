# Colombia (CO) policy pack manifest. Manifest format: spec §11.1.1.
packId: CO
scope: country
country: CO
version: "2026.10.04"
lastChecked: "2026-10-04"
extends: global
languages: [es]
files:
  - higher-education/ley-30-1992.yaml
  - academic-standards/ntc-1486-2022.yaml
  - research-integrity/minciencias-res-0314-2018.yaml
  - copyright/ley-23-1982.yaml

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="laya-icon-title laya-icon-desc">
  <title id="laya-icon-title">Laya Decisions</title>
  <desc id="laya-icon-desc">An amber-to-red chip whose output forks into cyan, green and violet choices on a dark tile, representing fast local decisions.</desc>
  <defs>
    <linearGradient id="laya-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#14203a"/>
    </linearGradient>
    <linearGradient id="laya-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#laya-bg)"/>
  <path d="M208 256H262L330 168M262 256H330M262 256L330 344" fill="none" stroke="#94a3b8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="192" width="128" height="128" rx="30" fill="url(#laya-chip)"/>
  <rect x="114" y="226" width="60" height="60" rx="14" fill="#14203a"/>
  <circle cx="144" cy="256" r="16" fill="#fcd34d"/>
  <circle cx="358" cy="168" r="30" fill="#22d3ee"/>

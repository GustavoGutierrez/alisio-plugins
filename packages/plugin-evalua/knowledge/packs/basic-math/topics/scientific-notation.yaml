keywords: [notación científica, potencias de 10, números grandes, números pequeños, mantisa]
supports:
  single_choice: true
  multiple_choice: false
  open: true
  practice: true
sources:
  - { kind: family, family: scientific-notation, levels: [basico, intermedio, avanzado, genio] }

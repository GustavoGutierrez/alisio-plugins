# Sources: MEN Estándares Básicos de Competencias, grados 8-9 (pensamiento numérico); CCSS 8.EE.A.3-4.
id: scientific-notation
name:
  es: "Notación científica"
code: NCI
grades: ["Octavo", "Noveno"]
prerequisites: [powers-roots]
objectives:
  - id: write-scientific
    text:
      es: "Escribe números muy grandes o muy pequeños en notación científica y en forma decimal."
    levels: [basico, intermedio, avanzado, genio]
  - id: operate-scientific
    text:
      es: "Multiplica y divide números escritos en notación científica."

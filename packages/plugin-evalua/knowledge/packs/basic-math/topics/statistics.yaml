id: statistics
name:
  es: "Estadística descriptiva: media, mediana y moda"
code: EST
# Cuarto and Quinto merged in from the primary "mean and median" topic (DBA grado 4-5): basico
# keeps small natural data sets.
grades: ["Cuarto", "Quinto", "Sexto", "Séptimo", "Octavo", "Noveno"]
prerequisites: [natural-numbers]
objectives:
  - id: central-measures
    text:
      es: "Calcula la media, la mediana y la moda de un conjunto pequeño de datos."
    levels: [basico, intermedio, avanzado, genio]
  - id: data-range
    text:
      es: "Interpreta el rango como medida de dispersión de los datos."
    levels: [avanzado, genio]
  # Merged from the "box plot and quartiles" topic (grades 8-9, CCSS 6.SP.B.4-5).
  - id: quartiles-boxplot
    text:
      es: "Calcula cuartiles y el rango intercuartílico, y lee diagramas de caja."
    levels: [avanzado, genio]
keywords: [estadística, media, mediana, moda, rango, datos, promedio, cuartiles, diagrama de caja]
supports:
  single_choice: true
  multiple_choice: false
  open: false
  practice: true
sources:
  - { kind: family, family: statistics, levels: [basico, intermedio, avanzado, genio] }
  - { kind: family, family: box-plot, levels: [avanzado, genio] }

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cardsmith</title>
  <desc id="desc">A fanned stack of three rounded cards — an illustrated greeting card with a retro sunset, an ivory certificate with a gold seal and a QR code, and a dark analytics card with blue bar charts — over a deep ocean-blue background with palette swatches and sparkles.</desc>

    <circle cx="852" cy="716" r="20" fill="#01a5f7" opacity="0.12"/>
    <circle cx="852" cy="716" r="12" fill="#01a5f7"/>
    <circle cx="904" cy="716" r="20" fill="#ec3b49" opacity="0.12"/>
    <circle cx="904" cy="716" r="12" fill="#ec3b49"/>

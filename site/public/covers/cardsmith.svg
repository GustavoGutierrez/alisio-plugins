      <stop offset="1" stop-color="#0e3350"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14507a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#14507a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="360" rx="640" ry="440" fill="url(#glow)"/>
  <circle cx="290" cy="190" r="250" fill="#d64293" opacity="0.06"/>

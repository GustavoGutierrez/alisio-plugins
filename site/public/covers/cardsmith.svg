  <text x="800" y="798" fill="#f4fbff" font-family="sans-serif" font-size="80" font-weight="700" text-anchor="middle">CARDSMITH</text>
  <text x="800" y="850" fill="#a8c6da" font-family="sans-serif" font-size="30" text-anchor="middle">cards · certificates · charts — rendered locally</text>

name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "registry/**"
      - "packages/**"
      - "scripts/scan-plugins.mjs"
      - "scripts/docs-check.mjs"
      - "scripts/lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --no-frozen-lockfile
      # Refresh npm publish recency so "Recently published" tracks the latest
      # releases. Degrades gracefully: the scanner keeps cached values and only
      # notes a warning when npm metadata is unavailable.
      # Build first: the scanner reads each plugin's id and categories from its
      # built `dist/index.js`, and falls back to `package.json` (which has no
      # categories) when the entry is missing, emptying the category filter.
      - run: pnpm build
      - run: pnpm docs:scan
      # The catalog cache is committed, so the site still builds without the network.
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
